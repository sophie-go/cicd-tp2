name: "CI - Tests Automatisés avec IA"
    
on: 
  push:
    branches: 
      - sgoales
jobs:
  test-and-analyze:
    name: Tests + Analyse IA
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.14.0]   
    steps:
      - name: Checkout du code 
        uses: actions/checkout@v6
      - name: Setup de python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run:
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Installation Chrome
        uses: browser-actions/setup-chrome@latest
      - name: Génération des Tests
        run: |
          python ai_tools/test_generator.py
          pytest tests/generated/ -v --html=reports/generated-report.html --self-contained-html
        continue-on-error: true
      - name: Tests visuels
        run: pytest tests/visual/ -v --html=reports/visual-report.html --self-contained-html
        continue-on-error: true
      - name: Exécution complète avec Allure
        if: always()
        run: |
          pytest tests/ -v --html=reports/full-report.html --self-contained-html --alluredir=reports/allure-results
        continue-on-error: true
      - name: Génération du rapport HTML Allure
        if: always()
        run: |
          npm install -g allure-commandline
          allure generate reports/allure-results --clean -o reports/allure-report
      - name: test-reports
        uses: actions/upload-artifact@v5
        path: reports/
        retention-days: 30
      - name: screenshots
        uses: actions/upload-artifact@v5
        path: screenshots/
        retention-days: 30


